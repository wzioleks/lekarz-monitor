name: ZnanyLekarz Monitor

on:
  schedule:
    # Sieć bezpieczeństwa: gdyby łańcuch self-restartu się przerwał (run padł i nie
    # odpalił następcy), schedule go wznowi. GitHub mocno throttluje schedule, więc
    # to TYLKO recovery — ciągłość 24/7 robi self-restart poniżej.
    - cron: '0 * * * *'
  workflow_dispatch:

# Jeden aktywny monitor naraz; następca czeka w kolejce i startuje po końcu bieżącego.
concurrency:
  group: zl-monitor
  cancel-in-progress: false

jobs:
  check-slots:
    runs-on: ubuntu-latest
    # ~6h to twardy limit jobu; pętla kończy się sama na 340 min, więc nie wpadamy
    # w timeout (timeout = fałszywy alert o awarii).
    timeout-minutes: 350

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install requests

      - name: Przywróć stan
        uses: actions/cache/restore@v4
        with:
          path: last_count.txt
          key: slot-state-v3-${{ github.run_id }}
          restore-keys: |
            slot-state-v3-

      # Pętla: sprawdzaj co 5 min przez ~5h40m. Pojedynczy błąd (np. chwilowy blip
      # ZnanyLekarz/sieci) jest tolerowany — dopiero 3 błędy POD RZĄD kończą run
      # i odpalają alert. Dzięki temu nie ma fałszywych alarmów ani spamu.
      - name: Monitoruj co 5 min
        env:
          DOCTOR_NAME:        ${{ secrets.DOCTOR_NAME }}
          DOCTOR_PAGE_URL:    ${{ secrets.DOCTOR_PAGE_URL }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DEADLINE=$(( $(date +%s) + 340*60 ))   # 5h40m
          i=0; fails=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))
            echo "::group::Sprawdzenie #$i ($(date -u +%H:%M:%S) UTC)"
            if python check_slots.py; then
              fails=0
            else
              fails=$((fails+1))
              echo "!! Sprawdzenie #$i nieudane ($fails z rzedu)"
              if [ "$fails" -ge 3 ]; then
                echo "::endgroup::"
                echo "3 bledy pod rzad — koncze run i alarmuje."
                exit 1
              fi
            fi
            echo "::endgroup::"
            # nie śpij po ostatniej iteracji tuż przed deadline
            [ "$(( $(date +%s) + 300 ))" -lt "$DEADLINE" ] && sleep 300 || break
          done
          echo "Petla OK po $i sprawdzeniach — odpalam nastepcę."

      - name: Zapisz stan
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_count.txt
          key: slot-state-v3-${{ github.run_id }}

      # SELF-RESTART: po czystym zakończeniu pętli odpal następny run (PAT, bo
      # wbudowany token nie może wyzwalać workflowów). To daje ciągłe 24/7 niezależnie
      # od throttlingu schedule. Przy awarii (run failed) ten krok jest pomijany —
      # wtedy wznawia schedule, żeby nie robić ciasnej pętli crashy.
      - name: Odpal następny run (ciągłość 24/7)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.ZL_PAT }}
        run: |
          echo "Odpalam kolejny run lancucha..."
          gh workflow run monitor.yml -R "${{ github.repository }}" --ref main

      - name: Alert o awarii
        if: failure()
        run: |
          curl -s \
            -H "Title: ZnanyLekarz Monitor — AWARIA" \
            -H "Priority: urgent" \
            -H "Tags: warning,skull" \
            -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Monitor PADL — przestaje sprawdzac terminy. Kliknij, zeby zobaczyc logi." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
