name: ZnanyLekarz Monitor

on:
  schedule:
    # GitHub mocno throttluje schedule (realnie odpala co kilka godzin, NIE co 5 min).
    # Dlatego schedule służy tu tylko do (re)startu długiej pętli poniżej — sam interwał
    # 5 min realizuje pętla wewnątrz uruchomienia.
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Jeden aktywny monitor naraz. Nowy run nie zabija działającej pętli — czeka w kolejce
# i startuje, gdy poprzednia (po ~5h40m) skończy → pokrycie jest ciągłe.
concurrency:
  group: zl-monitor
  cancel-in-progress: false

jobs:
  check-slots:
    runs-on: ubuntu-latest
    # ~6h to twardy limit jobu GitHuba; pętla kończy się sama wcześniej (340 min),
    # więc nie wpadamy w timeout (timeout = fałszywy alert o awarii).
    timeout-minutes: 350

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install requests

      # Przywróć zapisany stan (ile terminów było poprzednio)
      - name: Przywróć stan
        uses: actions/cache/restore@v4
        with:
          path: last_count.txt
          key: slot-state-${{ github.run_id }}
          restore-keys: |
            slot-state-

      # Pętla: sprawdzaj co 5 min przez ~5h40m. last_count.txt trzyma stan między
      # iteracjami na dysku (bez round-tripu cache co 5 min).
      - name: Monitoruj co 5 min
        env:
          DOCTOR_NAME:        ${{ secrets.DOCTOR_NAME }}
          DOCTOR_PAGE_URL:    ${{ secrets.DOCTOR_PAGE_URL }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DEADLINE=$(( $(date +%s) + 340*60 ))   # 5h40m
          i=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            i=$((i+1))
            echo "::group::Sprawdzenie #$i"
            python check_slots.py || { echo "::endgroup::"; exit 1; }   # błąd → alert + restart
            echo "::endgroup::"
            # nie śpij po ostatniej iteracji tuż przed deadline
            [ "$(( $(date +%s) + 300 ))" -lt "$DEADLINE" ] && sleep 300 || break
          done
          echo "Pętla zakończona po $i sprawdzeniach — kolejny run przejmie pałeczkę."

      # Zapisz stan na następny run (zapis po naturalnym końcu pętli)
      - name: Zapisz stan
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_count.txt
          key: slot-state-${{ github.run_id }}

      # Alert na telefon, gdy monitor padł (np. ZnanyLekarz zmienił API/strukturę strony)
      - name: Alert o awarii
        if: failure()
        run: |
          curl -s \
            -H "Title: ZnanyLekarz Monitor — AWARIA" \
            -H "Priority: urgent" \
            -H "Tags: warning,skull" \
            -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Monitor PADL — przestaje sprawdzac terminy. Kliknij, zeby zobaczyc logi." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
