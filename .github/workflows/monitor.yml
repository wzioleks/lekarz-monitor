name: ZnanyLekarz Monitor

on:
  schedule:
    # Co 5 minut, całą dobę (5 min to minimalny interwał GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    # Możliwość ręcznego uruchomienia z GitHuba (przycisk "Run workflow")

jobs:
  check-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zależności
        run: pip install requests

      # Przywróć zapisany stan (ile terminów było poprzednio)
      - name: Przywróć stan
        uses: actions/cache/restore@v4
        with:
          path: last_count.txt
          key: slot-state-${{ github.run_id }}
          restore-keys: |
            slot-state-

      # Sprawdź terminy i wyślij powiadomienie jeśli potrzeba
      - name: Sprawdź terminy
        env:
          DOCTOR_NAME:        ${{ secrets.DOCTOR_NAME }}
          DOCTOR_PAGE_URL:    ${{ secrets.DOCTOR_PAGE_URL }}
          NTFY_TOPIC:         ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_slots.py

      # Zapisz nowy stan na następne uruchomienie
      - name: Zapisz stan
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_count.txt
          key: slot-state-${{ github.run_id }}

      # Alert na telefon, gdy monitor padł (np. ZnanyLekarz zmienił API)
      - name: Alert o awarii
        if: failure()
        run: |
          curl -s \
            -H "Title: ZnanyLekarz Monitor — AWARIA" \
            -H "Priority: urgent" \
            -H "Tags: warning,skull" \
            -H "Click: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Monitor PADL — przestaje sprawdzac terminy. Kliknij, zeby zobaczyc logi." \
            "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}" || true
