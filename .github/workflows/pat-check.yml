name: PAT check (tymczasowy)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdz PAT
        env:
          GH_TOKEN: ${{ secrets.ZL_PAT }}
        run: |
          echo "--- data wygasniecia tokenu ---"
          curl -sI -H "Authorization: Bearer $GH_TOKEN" https://api.github.com \
            | grep -i "expiration" || echo "(brak naglowka expiration)"

          echo "--- test odczytu (actions: read) ---"
          gh api "repos/${{ github.repository }}/actions/workflows" --jq '.total_count' \
            && echo "ODCZYT OK" || { echo "ODCZYT FAIL"; exit 1; }

          echo "--- test zapisu = dokladnie to, co robi self-restart ---"
          if gh workflow run monitor.yml -R "${{ github.repository }}" --ref main; then
            echo "ZAPIS OK — self-restart bedzie dzialac"
          else
            echo "ZAPIS FAIL — PAT nie ma uprawnien Actions: Read and write"
            exit 1
          fi
